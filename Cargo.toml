[workspace]
resolver = "3"
members = [
    "crates/termx-protocol",
    "crates/termx-shell-events",
    "crates/termx-runtime",
    "crates/termx-terminal",
    "crates/termx-proc",
    "crates/termx-ssh",
    "crates/termx-core",
    "crates/termx-service",
    "crates/termx-client",
    "crates/termx-cli",
    "crates/termx-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# M0 只预留下述公共依赖；PTY/SSH 等平台依赖留到 M1+ 按需引入。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# M1 本机 WebSocket 传输 / 鉴权所需依赖。
tokio = { version = "1", features = ["full"] }
# 0.30 起 tokio-tungstenite 默认即 Tokio 实现，不再提供 `tokio` feature。
tokio-tungstenite = "0.30"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 按日文件日志的非阻塞写入与退出前 flush。
tracing-appender = "0.2"
rand = "0.10"

# M1/F2 终端 registry 所需：全局唯一 ID 与 RFC3339 时间戳。
ulid = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

# M2c1：PTY 输出按协议要求以 base64 承载。
base64 = "0.22"
# M6b-2：helper 分发时的 sha256 校验（与 russh 传递依赖同版本）。
sha2 = "0.11"

# M5b：CLI 子命令解析。
clap = { version = "4", features = ["derive"] }

# W1：内置 Web 服务（HTTP 静态页 + WebSocket 代理）。
axum = { version = "0.8", features = ["ws", "form"] }
# 登录密码常量时间比较。
subtle = "2"
