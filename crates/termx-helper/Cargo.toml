[package]
name = "termx-helper"
description = "远端 sidecar：JSON Lines stdio 协议与本地 PTY 会话"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "termx_helper"
path = "src/lib.rs"

[[bin]]
name = "termx-helper"
path = "src/main.rs"

[dependencies]
termx-protocol = { path = "../termx-protocol" }
termx-proc = { path = "../termx-proc" }
termx-shell-events = { path = "../termx-shell-events" }
base64 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
