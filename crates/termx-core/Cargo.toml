[package]
name = "termx-core"
description = "会话状态机、registry、事件总线与背压（M0 占位）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
termx-protocol = { path = "../termx-protocol" }
# 依赖方向：proc 不依赖 core；core 依赖 proc 以接入真实 PTY 后端。
termx-proc = { path = "../termx-proc" }
# 交互识别复用 terminal 的 OSC 133/633 增量扫描器。
termx-terminal = { path = "../termx-terminal" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
