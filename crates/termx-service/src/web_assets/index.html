<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>termx</title>
    <link rel="stylesheet" href="/static/xterm.css" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="termx-body">
    <header class="termx-header">
      <strong class="termx-brand">termx</strong>
      <div class="termx-tabs" role="tablist" aria-label="视图">
        <button id="termx-tab-info" class="termx-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="termx-view-info">信息</button>
        <button id="termx-tab-raw" class="termx-tab" type="button" role="tab" aria-selected="false" aria-controls="termx-view-raw">原始控制台</button>
      </div>
      <div class="termx-controls">
        <label class="termx-field" for="termx-session">会话</label>
        <select id="termx-session" class="termx-select termx-select-session" disabled>
          <option value="">正在加载…</option>
        </select>
        <label class="termx-field" for="termx-terminal">终端</label>
        <select id="termx-terminal" class="termx-select" disabled>
          <option value="">正在加载…</option>
        </select>
        <button id="termx-refresh" class="termx-button" type="button" disabled>刷新</button>
        <button id="termx-create-open" class="termx-button termx-primary" type="button" disabled>
          新建终端
        </button>
        <button id="termx-terminate" class="termx-button termx-danger" type="button" disabled>
          终止
        </button>
        <button id="termx-rebind-open" class="termx-button" type="button" disabled>迁移…</button>
      </div>
    </header>
    <dialog id="termx-rebind-dialog" class="termx-dialog" aria-labelledby="termx-rebind-title">
      <form id="termx-rebind-form" class="termx-dialog-form">
        <h2 id="termx-rebind-title" class="termx-dialog-title">迁移终端</h2>
        <p id="termx-rebind-current" class="termx-dialog-hint"></p>
        <label class="termx-field" for="termx-rebind-root">目标会话</label>
        <select id="termx-rebind-root" class="termx-select" disabled>
          <option value="">正在加载…</option>
        </select>
        <label class="termx-field" for="termx-rebind-name">新名称（可选）</label>
        <input
          id="termx-rebind-name"
          class="termx-input"
          type="text"
          placeholder="留空保留原名"
          autocomplete="off"
          spellcheck="false"
        />
        <label class="termx-check">
          <input id="termx-rebind-force" type="checkbox" />
          force（覆盖目标会话中的同名终端）
        </label>
        <p id="termx-rebind-error" class="termx-dialog-error" role="alert" hidden></p>
        <div class="termx-dialog-actions">
          <button id="termx-rebind-cancel" class="termx-button" type="button">取消</button>
          <button id="termx-rebind-submit" class="termx-button termx-primary" type="submit" disabled>
            确认迁移
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      id="termx-create-dialog"
      class="termx-dialog termx-dialog-wide"
      aria-labelledby="termx-create-title"
    >
      <form id="termx-create-form" class="termx-dialog-form">
        <h2 id="termx-create-title" class="termx-dialog-title">新建终端</h2>
        <label class="termx-field" for="termx-create-root">绑定会话</label>
        <select id="termx-create-root" class="termx-select" disabled>
          <option value="">正在加载…</option>
        </select>
        <div class="termx-form-grid">
          <div>
            <label class="termx-field" for="termx-create-name">名称</label>
            <input
              id="termx-create-name"
              class="termx-input"
              type="text"
              value="default"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div>
            <label class="termx-field" for="termx-create-type">类型</label>
            <select id="termx-create-type" class="termx-select">
              <option value="local">本地（local）</option>
              <option value="ssh">SSH</option>
            </select>
          </div>
        </div>

        <div id="termx-create-local" class="termx-form-section">
          <label class="termx-field" for="termx-create-runtime">运行环境</label>
          <select id="termx-create-runtime" class="termx-select">
            <option value="">自定义 cmd/args</option>
          </select>
          <div id="termx-create-custom">
            <label class="termx-field" for="termx-create-cmd">程序</label>
            <input
              id="termx-create-cmd"
              class="termx-input"
              type="text"
              placeholder="/bin/bash 或 cmd.exe"
              autocomplete="off"
              spellcheck="false"
            />
            <label class="termx-field" for="termx-create-args">参数（空格分隔，可加引号）</label>
            <input
              id="termx-create-args"
              class="termx-input"
              type="text"
              placeholder="例如 -l 或 --foo &quot;bar baz&quot;"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <label class="termx-field" for="termx-create-cwd">工作目录（可选）</label>
          <input
            id="termx-create-cwd"
            class="termx-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
          />
          <label class="termx-field" for="termx-create-env">环境变量（每行 KEY=VALUE，可选）</label>
          <textarea id="termx-create-env" class="termx-input termx-textarea" rows="3"></textarea>
        </div>

        <div id="termx-create-ssh" class="termx-form-section termx-form-hidden">
          <div class="termx-form-grid">
            <div>
              <label class="termx-field" for="termx-create-host">主机</label>
              <input id="termx-create-host" class="termx-input" type="text" autocomplete="off" spellcheck="false" />
            </div>
            <div>
              <label class="termx-field" for="termx-create-port">端口</label>
              <input id="termx-create-port" class="termx-input" type="number" min="1" max="65535" value="22" />
            </div>
          </div>
          <label class="termx-field" for="termx-create-user">用户</label>
          <input id="termx-create-user" class="termx-input" type="text" autocomplete="off" spellcheck="false" />
          <label class="termx-field" for="termx-create-auth">认证方式</label>
          <select id="termx-create-auth" class="termx-select">
            <option value="password">密码</option>
            <option value="key">私钥</option>
          </select>
          <div id="termx-create-password-group">
            <label class="termx-field" for="termx-create-password">密码</label>
            <input
              id="termx-create-password"
              class="termx-input"
              type="password"
              autocomplete="new-password"
            />
          </div>
          <div id="termx-create-key-group" class="termx-form-hidden">
            <label class="termx-field" for="termx-create-key-path">私钥路径</label>
            <input id="termx-create-key-path" class="termx-input" type="text" autocomplete="off" spellcheck="false" />
            <label class="termx-field" for="termx-create-key-passphrase">私钥口令（可选）</label>
            <input
              id="termx-create-key-passphrase"
              class="termx-input"
              type="password"
              autocomplete="new-password"
            />
          </div>
          <label class="termx-field" for="termx-create-ssh-runtime">运行环境</label>
          <select id="termx-create-ssh-runtime" class="termx-select">
            <option value="termx-pwsh">termx-pwsh（带外事件）</option>
            <option value="">系统 shell</option>
          </select>
          <label class="termx-check">
            <input id="termx-create-any-host-key" type="checkbox" />
            接受任意主机密钥（accept-any-host-key）
          </label>
        </div>

        <div class="termx-form-grid">
          <div>
            <label class="termx-field" for="termx-create-cols">列（cols）</label>
            <input id="termx-create-cols" class="termx-input" type="number" min="2" max="1000" value="120" />
          </div>
          <div>
            <label class="termx-field" for="termx-create-rows">行（rows）</label>
            <input id="termx-create-rows" class="termx-input" type="number" min="1" max="1000" value="30" />
          </div>
        </div>
        <p id="termx-create-error" class="termx-dialog-error" role="alert" hidden></p>
        <div class="termx-dialog-actions">
          <button id="termx-create-cancel" class="termx-button" type="button">取消</button>
          <button id="termx-create-submit" class="termx-button termx-primary" type="submit">
            创建
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      id="termx-consent-dialog"
      class="termx-dialog termx-dialog-wide"
      aria-labelledby="termx-consent-title"
      aria-describedby="termx-consent-notes"
    >
      <form id="termx-consent-form" class="termx-dialog-form">
        <h2 id="termx-consent-title" class="termx-dialog-title">确认远端写入</h2>
        <p id="termx-consent-host" class="termx-dialog-hint"></p>
        <ul id="termx-consent-writes" class="termx-consent-writes"></ul>
        <p id="termx-consent-notes" class="termx-consent-notes">
          将使用当前 SSH 用户权限写入以上文件；不会覆盖其他文件；不会自动删除旧版本。本次授权只对本次创建有效。
        </p>
        <p id="termx-consent-error" class="termx-dialog-error" role="alert" hidden></p>
        <div class="termx-dialog-actions">
          <button id="termx-consent-cancel" class="termx-button" type="button">取消</button>
          <button id="termx-consent-confirm" class="termx-button termx-primary" type="submit">
            允许并创建
          </button>
        </div>
      </form>
    </dialog>
    <main class="termx-main">
      <section id="termx-view-info" class="termx-view termx-info-view" role="tabpanel" aria-labelledby="termx-tab-info">
        <div id="termx-info-meta" class="termx-info-meta" hidden></div>
        <div id="termx-transcript" class="termx-transcript" aria-live="polite"></div>
        <form id="termx-info-form" class="termx-info-form">
          <input id="termx-info-input" class="termx-input termx-info-input" type="text" placeholder="输入命令并回车" autocomplete="off" spellcheck="false" disabled />
          <button id="termx-info-send" class="termx-button termx-primary" type="submit" disabled>发送</button>
        </form>
      </section>
      <section id="termx-view-raw" class="termx-view termx-raw-view termx-view-hidden" role="tabpanel" aria-labelledby="termx-tab-raw">
        <div id="termx-term" class="termx-term" aria-label="终端输出"></div>
      </section>
    </main>
    <div id="termx-statusbar" class="termx-statusbar" role="status" aria-live="polite" hidden></div>
    <script src="/static/xterm.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
