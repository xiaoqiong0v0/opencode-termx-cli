[package]
name = "termx-cli"
description = "termx 客户端 CLI：local/exec/terminal 子命令"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "termx-cli"
path = "src/main.rs"

[dependencies]
termx-client = { path = "../termx-client" }
termx-protocol = { path = "../termx-protocol" }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
# 测试优先起真实 service 二进制；跨包无法拿到 CARGO_BIN_EXE 时退回进程内 service。
termx-service = { path = "../termx-service" }
